<!DOCTYPE html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — DXN Wellness Store Malaysia</title>
<meta name="description" content="Inspect this DXN product in live 3D, check the label and pack size, then order online or via WhatsApp. Malaysian stock, nationwide delivery.">
<meta name="theme-color" content="#D6161C">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body data-page="shop">

<div id="site-header"></div>

<main id="main">
  <div class="wrap" id="pdp-root" style="padding-top:22px">
    <div class="crumbs" id="crumbs"></div>
  </div>

  <div class="wrap">
    <section class="pdp" id="pdp" hidden>

      <!-- 3D -->
      <div class="pdp__stage">
        <div class="viewer pdp__viewer" id="pdp-viewer">
          <div class="viewer__hint">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V6a2 2 0 1 1 4 0v5"/><path d="M13 11V5.5a2 2 0 1 1 4 0V13"/><path d="M17 11.5a2 2 0 1 1 4 0V15a6 6 0 0 1-6 6h-2.2a6 6 0 0 1-4.6-2.1L4 14.2a2 2 0 0 1 3-2.6l2 2.2"/></svg>
            Drag to rotate · scroll to zoom
          </div>
          <div class="viewer__badge" id="pdp-badge">LIVE 3D</div>
          <div class="viewer__hud">
            <div class="viewer__tools">
              <button class="toolbtn" id="btn-spin" title="Pause / resume rotation" aria-label="Pause or resume rotation">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
              </button>
              <button class="toolbtn" id="btn-zoomin" title="Zoom in" aria-label="Zoom in">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <button class="toolbtn" id="btn-zoomout" title="Zoom out" aria-label="Zoom out">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
              </button>
              <button class="toolbtn" id="btn-reset" title="Reset view" aria-label="Reset view">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V10H9"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="pdp__thumbs" id="angles"></div>
      </div>

      <!-- info -->
      <div class="pdp__info" id="pdp-info"></div>
    </section>

    <section class="section section--tight" id="related-section" hidden>
      <div class="section__head">
        <div>
          <span class="eyebrow eyebrow--leaf"><span class="dot"></span> Goes well with</span>
          <h2 style="margin-top:16px">Customers also bought</h2>
        </div>
        <a class="btn btn--outline" href="catalogue.html">All products</a>
      </div>
      <div class="grid grid--3" id="related"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<noscript><div class="wrap" style="padding:24px"><p><strong>Please enable JavaScript</strong> to view this product.</p></div></noscript>
<script type="module" src="js/product.js"></script>
</body>
</html>
