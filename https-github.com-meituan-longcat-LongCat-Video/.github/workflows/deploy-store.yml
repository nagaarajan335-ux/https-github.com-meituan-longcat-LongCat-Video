name: Deploy DXN 3D Store to GitHub Pages

on:
  push:
    branches:
      - "arena/e811ef9f-https-github-com-meituan-longc"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pages (enables the site on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the store as the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dxn-store

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
