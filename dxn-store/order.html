<!DOCTYPE html>
<html lang="en-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmation — DXN Wellness Store Malaysia</title>
<meta name="description" content="Your DXN order has been recorded. Confirm it on WhatsApp and we'll dispatch it.">
<meta name="theme-color" content="#0E7A5F">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body data-page="shop">

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <div class="donebox" id="donebox">
      <div class="donebox__ico">
        <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
      </div>
      <h1 id="done-title">Thank you — your order is recorded</h1>
      <p id="done-lead">We've saved your order on this device. One last step: send it to us on WhatsApp so we can confirm stock and dispatch it.</p>

      <div class="oid">
        <span id="oid-label">Order ID</span>
        <strong id="oid-value">—</strong>
        <button id="oid-copy">Copy</button>
      </div>

      <div class="hero__cta" style="justify-content:center;margin-bottom:34px">
        <a class="btn btn--wa btn--lg" id="wa-send" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.94.53 3.75 1.44 5.3L2 22l4.98-1.6a9.8 9.8 0 0 0 5.06 1.4h.01c5.43 0 9.84-4.4 9.84-9.84C21.89 6.4 17.48 2 12.04 2Zm0 17.98h-.01a8.2 8.2 0 0 1-4.16-1.14l-.3-.18-3.1 1 .83-3.03-.2-.31a8.13 8.13 0 0 1-1.25-4.35c0-4.5 3.68-8.17 8.19-8.17a8.17 8.17 0 0 1 0 16.18Z"/></svg>
          Send order on WhatsApp
        </a>
        <button class="btn btn--ghost btn--lg" id="print-order">Print / save PDF</button>
      </div>

      <section class="panel receipt" id="receipt"></section>

      <div class="steps" id="steps"></div>

      <div class="hero__cta" style="justify-content:center;margin-top:10px">
        <a class="btn btn--primary" href="catalogue.html">Continue shopping</a>
        <a class="btn btn--ghost" href="contact.html">Contact us</a>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<noscript><div class="wrap" style="padding:24px"><p><strong>Please enable JavaScript</strong> to view your order.</p></div></noscript>
<script type="module" src="js/order.js"></script>
</body>
</html>
